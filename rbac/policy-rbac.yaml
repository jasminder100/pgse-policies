# ---------- 1. Policy admins: full control ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgse-policy-admin
rules:
- apiGroups: ["templates.gatekeeper.sh"]
  resources: ["constrainttemplates"]
  verbs: ["*"]
- apiGroups: ["constraints.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["pgse.io"]            # <-- your Waiver CRD's group
  resources: ["*"]
  verbs: ["*"]
---
# ---------- 2. Developers: read-only ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgse-policy-viewer
rules:
- apiGroups: ["templates.gatekeeper.sh", "constraints.gatekeeper.sh", "status.gatekeeper.sh", "pgse.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
# ---------- 3. Break-glass: loosen, never delete ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgse-breakglass
rules:
- apiGroups: ["templates.gatekeeper.sh"]
  resources: ["constrainttemplates"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["constraints.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["pgse.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create"]
---
# ---------- Bindings: role -> group ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgse-policy-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgse-policy-admin
subjects:
- kind: Group
  name: "eb925615-794e-42ac-8670-6e8aa819221b"   # Entra group: pgse-policy-admins
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgse-policy-viewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgse-policy-viewer
subjects:
- kind: Group
  name: "2067c7eb-ce78-4689-b518-d03dc99c72af"   # Entra group: pgse-developers
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgse-breakglass-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgse-breakglass
subjects:
- kind: Group
  name: "33e01255-3d54-42f4-a67c-edca15e20a39"   # Entra group: pgse-breakglass
  apiGroup: rbac.authorization.k8s.io
