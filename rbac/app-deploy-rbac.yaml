apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgse-app-deployer
  namespace: demo
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgse-app-deployer-binding
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgse-app-deployer
subjects:
- kind: Group
  name: "4502bcd2-a69d-4de9-9225-008932b62f71"   # Entra group: pgse-deployers
  apiGroup: rbac.authorization.k8s.io
