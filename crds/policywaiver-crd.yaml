apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: policywaivers.pgse.io
spec:
  group: pgse.io
  scope: Cluster
  names:
    kind: PolicyWaiver
    plural: policywaivers
    singular: policywaiver
    shortNames: [pw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Rule, type: string, jsonPath: .spec.rule}
        - {name: Namespace, type: string, jsonPath: .spec.namespace}
        - {name: Prefix, type: string, jsonPath: .spec.namePrefix}
        - {name: Expires, type: string, jsonPath: .spec.expiresAt}
        - {name: Ticket, type: string, jsonPath: .spec.ticket}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [rule, namespace, expiresAt, reason, approvedBy, ticket]
              properties:
                rule:
                  type: string
                  pattern: '^P[0-9]{2}$'
                  description: PGSE rule being waived, e.g. P08
                  x-kubernetes-validations:
                    - rule: "!(self in ['P01', 'P03', 'P04', 'P24'])"
                      message: "P01, P03, P04 and P24 can never be waived; fix the workload instead"
                namespace:
                  type: string
                  minLength: 1
                namePrefix:
                  type: string
                  default: ""
                  description: Only objects whose name starts with this are waived ("" = whole namespace)
                expiresAt:
                  type: string
                  format: date-time
                  description: RFC3339 time after which the waiver stops applying
                reason:
                  type: string
                  minLength: 10
                approvedBy:
                  type: string
                  minLength: 1
                ticket:
                  type: string
                  minLength: 1
