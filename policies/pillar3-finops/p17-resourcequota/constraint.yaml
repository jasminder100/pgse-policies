apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseResourceQuota
metadata:
  name: p17-namespace-resourcequota
spec:
  # warn, permanently: a namespace's quota can only be created AFTER the namespace,
  # so this rule is enforced by the AUDIT, not at admission.
  enforcementAction: warn
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "kube-public", "kube-node-lease", "default"]
