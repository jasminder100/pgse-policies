kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: p18-standard-annotations
tests:
  - name: p18-standard-annotations
    template: template.yaml
    constraint: constraint.yaml
    cases:
      - name: allowed-sample
        object: samples/allowed.yaml
        assertions:
          - violations: no
      - name: missing-annotations-denied
        object: samples/disallowed.yaml
        assertions:
          - violations: yes
      - name: http-url-denied
        object: samples/bad-url.yaml
        assertions:
          - violations: yes
