apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseOwnershipLabels
metadata:
  name: p14-ownership-labels
spec:
  enforcementAction: warn
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace", "Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "kube-public", "kube-node-lease", "default"]
  parameters:
    labels: ["owner", "team", "cost-center"]
