apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-https
  namespace: demo
spec:
  tls:
    - hosts: ["app.example.com"]
      secretName: app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgse-sample-app
                port:
                  number: 8080
