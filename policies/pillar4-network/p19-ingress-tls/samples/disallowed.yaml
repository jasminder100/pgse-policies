apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-http-only
  namespace: demo
spec:
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgse-sample-app
                port:
                  number: 8080
