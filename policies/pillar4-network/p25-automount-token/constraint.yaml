apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseAutomountToken
metadata:
  name: p25-no-automount-token
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod", "ServiceAccount"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    allowedServiceAccounts:
      - "dev/config-reader"   # built-in exception: reads ConfigMaps through the Kubernetes API
