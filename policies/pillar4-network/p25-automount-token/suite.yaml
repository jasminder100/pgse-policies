kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: p25-automount-token
tests:
  - name: p25-automount-token
    template: template.yaml
    constraint: constraint.yaml
    cases:
      - name: allowed-sample
        object: samples/allowed.yaml
        assertions:
          - violations: no
      - name: disallowed-sample
        object: samples/disallowed.yaml
        assertions:
          - violations: yes
      - name: serviceaccount-allowed
        object: samples/sa-allowed.yaml
        assertions:
          - violations: no
      - name: serviceaccount-disallowed
        object: samples/sa-disallowed.yaml
        assertions:
          - violations: yes
      - name: approved-service-account-workload
        object: samples/approved-sa-workload.yaml
        assertions:
          - violations: no
      - name: unapproved-service-account-workload
        object: samples/unapproved-sa-workload.yaml
        assertions:
          - violations: yes
      - name: approved-serviceaccount-object
        object: samples/sa-approved.yaml
        assertions:
          - violations: no
