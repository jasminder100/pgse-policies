apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spgseautomounttoken
  annotations:
    pgse.io/rule: "25"
    pgse.io/pillar: "network"
    description: Requires disabling automatic service account token mounting.
spec:
  crd:
    spec:
      names:
        kind: K8sPgseAutomountToken
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedServiceAccounts:
              description: Built-in exception - service accounts ("namespace/name") allowed to use the API token. "default" can never be approved.
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spgseautomounttoken

        import future.keywords.contains
        import future.keywords.if
        import future.keywords.in

        rule_id := "P25"

        # Rule 25a: workloads must explicitly opt OUT of the API token (missing = mounted)
        violation contains {"msg": msg} if {
        	not waived
        	object.get(pod_spec, "automountServiceAccountToken", null) != false
        	not sa_allowed(obj_namespace, workload_sa)
        	msg := sprintf("[P25] %v <%v> must set spec.automountServiceAccountToken: false (if the app needs the Kubernetes API, use an approved service account or request a waiver)", [input.review.object.kind, obj_name])
        }

        # Rule 25b: ServiceAccounts must also disable automount, except the auto-created "default"
        violation contains {"msg": msg} if {
        	not waived
        	input.review.object.kind == "ServiceAccount"
        	obj_name != "default"
        	not sa_allowed(obj_namespace, obj_name)
        	object.get(input.review.object, "automountServiceAccountToken", null) != false
        	msg := sprintf("[P25] ServiceAccount <%v> must set automountServiceAccountToken: false", [obj_name])
        }

        # --- built-in exception: approved service accounts ("namespace/name") may use the API token ---
        # The "default" service account can never be approved: every pod without an explicit
        # serviceAccountName uses it, so approving it would silently exempt the whole namespace.
        allowed_service_accounts := object.get(object.get(input, "parameters", {}), "allowedServiceAccounts", [])

        sa_allowed(ns, name) if {
        	name != "default"
        	sprintf("%v/%v", [ns, name]) in allowed_service_accounts
        }

        workload_sa := object.get(pod_spec, "serviceAccountName", object.get(pod_spec, "serviceAccount", "default"))

        # --- shared helper: find the pod spec in any workload kind ---
        pod_spec := input.review.object.spec if input.review.object.kind == "Pod"
        pod_spec := input.review.object.spec.jobTemplate.spec.template.spec if input.review.object.kind == "CronJob"
        pod_spec := input.review.object.spec.template.spec if {
        	not input.review.object.kind in {"Pod", "CronJob"}
        }

        containers contains c if some c in pod_spec.containers
        containers contains c if some c in pod_spec.initContainers
        containers contains c if some c in pod_spec.ephemeralContainers

        # --- shared helper: object identity (Pods created by controllers only have generateName at admission) ---
        obj_name := n if n := input.review.object.metadata.name

        obj_name := n if {
        	not input.review.object.metadata.name
        	n := input.review.object.metadata.generateName
        }

        obj_namespace := ns if ns := input.review.object.metadata.namespace

        obj_namespace := ns if {
        	not input.review.object.metadata.namespace
        	ns := input.review.namespace
        }

        # --- shared helper: time-bound waivers ---
        # PolicyWaiver objects (pgse.io/v1alpha1, cluster-scoped) are synced by Gatekeeper into data.inventory.
        # A waiver matches when rule + namespace match, the object name starts with namePrefix ("" = whole
        # namespace), and expiresAt is still in the future. Once expired, the violation comes back automatically.
        waived if {
        	some w in data.inventory.cluster["pgse.io/v1alpha1"].PolicyWaiver
        	w.spec.rule == rule_id
        	w.spec.namespace == obj_namespace
        	startswith(obj_name, object.get(w.spec, "namePrefix", ""))
        	time.parse_rfc3339_ns(w.spec.expiresAt) > time.now_ns()
        }
