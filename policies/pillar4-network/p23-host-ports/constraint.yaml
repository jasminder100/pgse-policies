apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseHostPorts
metadata:
  name: p23-restrict-host-ports
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    minHostPort: 1024
    sensitivePorts: [2375, 2376, 2379, 2380, 6443, 10250, 10255]
