apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgsePlaintextSecrets
metadata:
  name: p24-no-plaintext-secrets
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    secretKeywords: ["password", "passwd", "pwd", "secret", "token", "key", "apikey", "credential", "credentials"]
