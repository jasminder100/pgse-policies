apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-unprivileged
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27.0
          resources:
           requests: { cpu: 50m, memory: 64Mi }
           limits:   { cpu: 100m, memory: 128Mi }
          securityContext:
            privileged: false
