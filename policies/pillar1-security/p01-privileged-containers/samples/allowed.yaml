apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ok
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: nginx:1.27.0
          securityContext:
            privileged: false
