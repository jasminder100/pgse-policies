apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-escalate
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-escalate}
  template:
    metadata:
      labels: {app: web-escalate}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27.0-alpine
          securityContext:
            allowPrivilegeEscalation: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 100m, memory: 128Mi}
