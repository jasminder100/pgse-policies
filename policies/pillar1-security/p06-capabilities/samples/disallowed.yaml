apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-sysadmin
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-sysadmin}
  template:
    metadata:
      labels: {app: web-sysadmin}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
