apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-caps-ok
  namespace: demo
  labels:
    owner: platform-team
    team: pgse
    cost-center: cc-1001
    environment: prod
  annotations:
    app.kubernetes.io/managed-by: github-actions
    repository-url: https://github.com/jasminder100/pgse-policies
spec:
  replicas: 2
  selector:
    matchLabels: {app: web-caps-ok}
  template:
    metadata:
      labels: {app: web-caps-ok}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: pgseacrjs2026.azurecr.io/mirror/nginx-unprivileged:1.27.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 100m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
