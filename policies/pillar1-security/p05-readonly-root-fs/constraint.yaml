apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseReadOnlyRootFs
metadata:
  name: p05-readonly-root-fs-prod
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    namespaceSelector:
      matchLabels:
        environment: prod
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
