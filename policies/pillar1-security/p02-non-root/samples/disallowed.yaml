apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-root
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-root}
  template:
    metadata:
      labels: {app: web-root}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 100m, memory: 128Mi}
