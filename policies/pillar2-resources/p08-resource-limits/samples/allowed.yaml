apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ok
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-ok}
  template:
    metadata:
      labels: {app: web-ok}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27.0-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 100m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
