apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseProbes
metadata:
  name: p12-require-probes
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
