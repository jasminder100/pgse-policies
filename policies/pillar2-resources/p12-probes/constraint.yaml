apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseProbes
metadata:
  name: p12-require-probes
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
    namespaceSelector:          # built-in exception: namespaces labelled pgse.io/policy-exception=testing are exempt
      matchExpressions:
        - key: pgse.io/policy-exception
          operator: NotIn
          values: ["testing"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
