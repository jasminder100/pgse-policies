apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseAllowedRegistries
metadata:
  name: p10-allowed-registries
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    allowedRegistries:
      - "pgseacrjs2026.azurecr.io"   # our own ACR only (exact host match)
