apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPgseAllowedRegistries
metadata:
  name: p10-allowed-registries
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    namespaceSelector:          # built-in exception: namespaces labelled pgse.io/policy-exception=testing are exempt
      matchExpressions:
        - key: pgse.io/policy-exception
          operator: NotIn
          values: ["testing"]
    excludedNamespaces: ["kube-system", "gatekeeper-system"]
  parameters:
    allowedRegistries:
      - "pgseacrjs2026.azurecr.io"   # our own ACR only (exact host match)
    allowedImages:
      - "docker.io/library/postgres"   # built-in exception: approved image from Docker Hub
