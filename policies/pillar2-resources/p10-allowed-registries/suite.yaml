kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: p10-allowed-registries
tests:
- name: p10-allowed-registries
  template: template.yaml
  constraint: constraint.yaml
  cases:
  - name: allowed-sample
    object: samples/allowed.yaml
    assertions:
    - violations: no
    inventory:
    - samples/ns-demo.yaml
  - name: disallowed-sample
    object: samples/disallowed.yaml
    assertions:
    - violations: yes
    inventory:
    - samples/ns-demo.yaml
  - name: approved-image-postgres
    object: samples/allowed-postgres.yaml
    assertions:
    - violations: no
    inventory:
    - samples/ns-demo.yaml
  - name: still-enforced-in-testing-namespace
    object: samples/disallowed-in-testing.yaml
    inventory:
    - samples/ns-testing.yaml
    assertions:
    - violations: yes
