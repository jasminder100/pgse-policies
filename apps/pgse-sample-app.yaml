# The sample app, deployed by Argo CD from git as a Helm chart (wave 4: after all policies are in place).
# To release: bump image.tag in pgse-sample-app/chart/values.yaml via a PR.
# CI renders the same chart (helm template) and checks it with gator + Checkov before merge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgse-sample-app
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/jasminder100/pgse-sample-app.git
    targetRevision: main
    path: chart
    helm:
      releaseName: pgse-sample-app
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 3m}
