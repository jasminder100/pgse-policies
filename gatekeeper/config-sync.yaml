# Tells Gatekeeper to replicate PolicyWaiver objects into its data cache (data.inventory),
# so every ConstraintTemplate can check for an active waiver.
apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  sync:
    syncOnly:
      - group: pgse.io
        version: v1alpha1
        kind: PolicyWaiver

      - group: ""
        version: v1
        kind: namespace
