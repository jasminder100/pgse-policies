# Gatekeeper Config:
# 1. match: central exemption of system namespaces (admission webhook + audit).
# 2. sync:  replicates these objects into Gatekeeper's data cache (data.inventory),
#           so ConstraintTemplates can check waivers, quotas, PDBs, netpols, etc.
apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
spec:
  match:
    - excludedNamespaces: ["kube-system", "gatekeeper-system", "argocd"]
      processes: ["audit", "webhook"]
  sync:
    syncOnly:
      - group: pgse.io
        version: v1alpha1
        kind: PolicyWaiver

      - group: ""
        version: v1
        kind: Namespace

      - group: ""
        version: v1
        kind: ResourceQuota

      - group: networking.k8s.io
        version: v1
        kind: NetworkPolicy

      - group: policy
        version: v1
        kind: PodDisruptionBudget

      - group: autoscaling
        version: v2
        kind: HorizontalPodAutoscaler
