# Bootstrap: applied once by hand (kubectl apply -f). Everything else comes from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgse-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jasminder100/pgse-policies.git
    targetRevision: main
    path: gitops
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true      # file deleted from git -> object deleted from cluster
      selfHeal: true   # manual kubectl change -> reverted to git state
    syncOptions:
      - SkipDryRunOnMissingResource=true   # constraint kinds don't exist until templates compile
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
